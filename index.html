<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Marktplan-Editor</title>
<style>
  /* Konzept: Rechenpapier. Blaue Rasterlinien auf hellem Blatt, Werkzeugleiste oben, Eigenschaften rechts.
     Farben je Bausteintyp wie in der App, damit der Export wiedererkennbar bleibt. */
  :root {
    --paper: #f8fafd;
    --grid: #d5e0f2;
    --grid-major: #a9bde0;
    --ink: #1c2a48;
    --muted: #5a6a88;
    --line: #cdd6e6;
    --panel: #ffffff;
    --panel-2: #eef2f9;
    --accent: #2850c8;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --stroke: #3f5078;
    --c-zone: #e1e8fa;
    --c-shelf: #e4e7ec;
    --c-aisle: #d9dee6;
    --c-fridge: #c9e6fb;
    --c-produce: #cfeacf;
    --c-bakery: #efdfc8;
    --c-promo: #ffe0bd;
    --c-counter: #dce1f3;
    --c-deposit: #e2deef;
    --c-entrance: #f2d6ee;
    --c-checkout: #d3d9e3;
    --c-wall: #1c2a48;
    --note-bg: #fffdf2;
    --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141b2b; --grid: #232e46; --grid-major: #34466a; --ink: #e3eafa; --muted: #94a4c4;
      --line: #2c3856; --panel: #1a2237; --panel-2: #222c46; --accent: #7fa0ff; --accent-ink: #0d1530;
      --danger: #ff8f86; --stroke: #8fa3d0;
      --c-zone: #2a3a66; --c-shelf: #343c4e; --c-aisle: #3a4254; --c-fridge: #1f4a6e; --c-produce: #2c5a35;
      --c-bakery: #5e4a30; --c-promo: #6a4a22; --c-counter: #33406a; --c-deposit: #433d63;
      --c-entrance: #5e3858; --c-checkout: #3b4358; --c-wall: #c3d0f0; --note-bg: #2b2a1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141b2b; --grid: #232e46; --grid-major: #34466a; --ink: #e3eafa; --muted: #94a4c4;
    --line: #2c3856; --panel: #1a2237; --panel-2: #222c46; --accent: #7fa0ff; --accent-ink: #0d1530;
    --danger: #ff8f86; --stroke: #8fa3d0;
    --c-zone: #2a3a66; --c-shelf: #343c4e; --c-aisle: #3a4254; --c-fridge: #1f4a6e; --c-produce: #2c5a35;
    --c-bakery: #5e4a30; --c-promo: #6a4a22; --c-counter: #33406a; --c-deposit: #433d63;
    --c-entrance: #5e3858; --c-checkout: #3b4358; --c-wall: #c3d0f0; --note-bg: #2b2a1c;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  }
  h1 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px;
    cursor: pointer; min-height: 34px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .sp { flex: 1 1 auto; }
  .tools, .palette { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button kbd { font-family: var(--font); font-size: .72rem; color: var(--muted); margin-left: 5px; }
  .tools button.on kbd { color: var(--accent-ink); opacity: .8; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 30px; font-size: .85rem; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--stroke); display: inline-block; }

  .work { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
  .sheet { flex: 1 1 auto; min-width: 0; position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
  svg#svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  svg#svg[data-tool="select"] { cursor: grab; }
  svg#svg[data-tool="pan"] { cursor: grabbing; }
  svg#svg:not([data-tool="select"]):not([data-tool="pan"]) { cursor: crosshair; }
  .hud { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .hud button { min-width: 34px; background: var(--panel); }
  .banner {
    position: absolute; left: 10px; top: 10px; max-width: min(430px, calc(100% - 20px)); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .82rem; color: var(--muted);
    display: flex; gap: 8px; align-items: center;
  }
  .banner button { min-height: 26px; padding: 2px 8px; font-size: .8rem; }

  .it .shape { stroke: var(--stroke); stroke-width: 1.4; vector-effect: non-scaling-stroke; cursor: move; }
  .it .hit { fill: transparent; cursor: move; }
  .it.sel .shape { stroke: var(--accent); stroke-width: 2.4; }
  .it.sel .hit { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .t-zone { fill: var(--c-zone); } .t-shelf { fill: var(--c-shelf); } .t-aisle { fill: var(--c-aisle); }
  .t-fridge { fill: var(--c-fridge); } .t-produce { fill: var(--c-produce); } .t-bakery { fill: var(--c-bakery); }
  .t-promo { fill: var(--c-promo); } .t-counter { fill: var(--c-counter); } .t-deposit { fill: var(--c-deposit); }
  .t-entrance { fill: var(--c-entrance); } .t-checkout { fill: var(--c-checkout); }
  .note { fill: var(--note-bg); stroke: var(--stroke); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-dasharray: 5 3; cursor: move; }
  .it.sel .note { stroke: var(--accent); stroke-width: 2.2; }
  .leader { stroke: var(--stroke); stroke-width: 1.4; vector-effect: non-scaling-stroke; fill: none; }
  .it.sel .leader { stroke: var(--accent); }
  .dot { fill: var(--stroke); }
  .it.sel .dot { fill: var(--accent); }
  .wall { stroke: var(--c-wall); stroke-width: 6; stroke-linecap: square; }
  .wallhit { stroke: transparent; stroke-width: 16; cursor: move; }
  .it.sel .wall { stroke: var(--accent); }
  .fo { pointer-events: none; overflow: hidden; }
  .lbl { box-sizing: border-box; width: 100%; height: 100%; padding: 3px 5px; font: 500 11px/1.25 var(--font); color: var(--ink);
         overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; word-break: break-word; }
  .lbl.zone { align-items: flex-start; justify-content: flex-start; text-align: left; padding: 4px 4px 4px 28px; font-weight: 600; }
  .lbl.big { font-size: 13px; }
  .lbl.note { font-weight: 400; align-items: flex-start; justify-content: flex-start; text-align: left; }
  .badge { fill: var(--accent); }
  .badge-t { fill: var(--accent-ink); font: 600 11px var(--font); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .h { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .h[data-h="nw"], .h[data-h="se"] { cursor: nwse-resize; }
  .h[data-h="ne"], .h[data-h="sw"] { cursor: nesw-resize; }
  .h[data-h="p1"], .h[data-h="p2"], .h[data-h="target"] { cursor: move; }
  .draft { opacity: .6; pointer-events: none; }
  svg[data-tool="place"] .it .shape { cursor: pointer; }
  svg[data-tool="place"] .it .hit { cursor: pointer; }
  .it.target .shape { stroke: var(--accent); stroke-width: 3.2; }
  .now { border: 1px solid var(--accent); border-radius: 10px; padding: 8px 10px; background: var(--paper); display: flex; flex-direction: column; gap: 3px; }
  .now b { font-size: 1.05rem; }
  .now small { color: var(--muted); }
  .now.empty { border-color: var(--line); color: var(--muted); }
  .pmsg { font-size: .85rem; color: var(--ink); min-height: 1.2em; }

  aside {
    flex: 0 0 310px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  }
  aside h2 { font-family: var(--font-display); font-size: .95rem; margin: 0; font-weight: 600; }
  aside h3 { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 0; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
  input, select, textarea {
    background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: .9rem; color: var(--ink);
    min-width: 0; width: 100%; box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hint { font-size: .8rem; color: var(--muted); line-height: 1.4; margin: 0; }
  .zl { display: flex; flex-direction: column; gap: 3px; }
  .zi { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 8px; background: var(--paper); }
  .zi.cur { border-color: var(--accent); }
  .zi .n { width: 1.4em; font-weight: 600; color: var(--accent); }
  .zi .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-size: .88rem; }
  .zi button { min-height: 26px; padding: 0 7px; }
  .status { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
  .status.err { color: var(--danger); }
  details summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
  .exp { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  #out { min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; }

  @media (max-width: 820px) {
    body { height: auto; }
    .work { flex-direction: column; }
    .sheet { height: 62vh; flex: none; }
    aside { flex: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
  <h1>Marktplan-Editor</h1>
  <span class="sp"></span>
  <button id="undo" title="Rückgängig (Strg+Z)">↶ Zurück</button>
  <button id="redo" title="Wiederholen (Strg+Y)">↷ Vor</button>
  <button id="aldi" title="Aldi-Grundriss aus deiner Excel-Datei laden">Aldi-Vorlage laden</button>
  <button id="newplan" title="Leeres Blatt anfangen">Leeres Blatt</button>
</div>

<div class="bar tools" id="tools">
  <button data-tool="select" title="Auswählen und verschieben (V)">Auswählen <kbd>V</kbd></button>
  <button data-tool="line" title="Wand oder Linie ziehen (L)">Wand / Linie <kbd>L</kbd></button>
  <button data-tool="text" title="Freies Textfeld (T)">Text <kbd>T</kbd></button>
  <button data-tool="callout" title="Notiz mit Linie zu einem Punkt (N)">Notiz mit Linie <kbd>N</kbd></button>
  <button data-tool="place" title="Artikel einem Bereich zuordnen (P)">Artikel platzieren <kbd>P</kbd></button>
</div>
<div class="palette" id="palette" aria-label="Bausteine zum Zeichnen"></div>

<div class="work">
  <div class="sheet" id="sheet">
    <svg id="svg" data-tool="select" role="img" aria-label="Kariertes Zeichenblatt">
      <defs>
        <pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
        <pattern id="g5" width="120" height="120" patternUnits="userSpaceOnUse">
          <path d="M120 0H0V120" fill="none" stroke="var(--grid-major)" stroke-width="1.2"/>
        </pattern>
      </defs>
      <g id="view">
        <rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#g1)"/>
        <rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#g5)"/>
        <g id="items"></g>
        <g id="handles"></g>
      </g>
    </svg>
    <div class="banner" id="banner" hidden><span id="bannerText"></span><button id="bannerClose">Ausblenden</button></div>
    <div class="hud">
      <button id="zout" title="Verkleinern" aria-label="Verkleinern">−</button>
      <button id="zin" title="Vergrößern" aria-label="Vergrößern">+</button>
      <button id="fit" title="Alles zeigen">Alles zeigen</button>
    </div>
  </div>

  <aside id="panel"></aside>
</div>

<script>
(function () {
  'use strict';
  var U = 24;               // Weltpixel pro Kästchen
  var ASPECT = 1.5;         // Höhe/Breite des Handy-Bildschirms, für den Export in die App
  var KEY = 'marktplan-editor-v1';

  var TYPES = {
    zone:     { label: 'Bereich',        w: 8,  h: 4 },
    shelf:    { label: 'Regal',          w: 6,  h: 1 },
    aisle:    { label: 'Gang-Regal',     w: 2,  h: 10 },
    fridge:   { label: 'Kühlung',        w: 10, h: 2 },
    produce:  { label: 'Auslage',        w: 4,  h: 3 },
    bakery:   { label: 'Brotstand',      w: 4,  h: 2 },
    promo:    { label: 'Aktionsfläche',  w: 6,  h: 3 },
    counter:  { label: 'Theke',          w: 8,  h: 2 },
    deposit:  { label: 'Pfandautomat',   w: 2,  h: 2 },
    entrance: { label: 'Eingang',        w: 4,  h: 2 },
    checkout: { label: 'Kasse',          w: 6,  h: 2 }
  };
  var TYPE_ORDER = ['zone', 'shelf', 'aisle', 'fridge', 'produce', 'bakery', 'promo', 'counter', 'deposit', 'entrance', 'checkout'];

  var state = { items: [] };
  var view = { x: 30, y: 30, k: 1 };
  var tool = 'select', rectType = 'zone';
  var sel = null, draft = null, drag = null;
  var hist = [], hidx = -1;
  var QKEY = KEY + '-queue';
  var lastPinTap = { k: '', t: 0 };
  var queue = '', placeMsg = '', placeZoneId = null;
  try { queue = localStorage.getItem(QKEY) || ''; } catch (e) { /* ohne Speicher weiterarbeiten */ }

  var $ = function (id) { return document.getElementById(id); };
  var svg = $('svg'), gView = $('view'), gItems = $('items'), gHandles = $('handles'), panel = $('panel');

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isBox(it) { return it.kind === 'rect' || it.kind === 'text' || it.kind === 'callout'; }
  function zonesSorted() {
    return state.items.filter(function (i) { return i.kind === 'rect' && i.type === 'zone'; })
      .sort(function (a, b) { return (a.order || 999) - (b.order || 999); });
  }
  function renumber() { zonesSorted().forEach(function (z, i) { z.order = i + 1; }); }
  function nextOrder() { var m = 0; zonesSorted().forEach(function (z) { m = Math.max(m, z.order || 0); }); return m + 1; }
  function lines(s) { return String(s || '').split(/[\n,;]+/).map(function (t) { return t.trim(); }).filter(Boolean); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim(); }
  function saveQueue() { try { localStorage.setItem(QKEY, queue); } catch (e) { /* ohne Speicher weiterarbeiten */ } }
  function queueList() { return String(queue || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function activeName() { var q = queueList(); return q.length ? q[0] : ''; }
  function zoneOfItem(name) {
    var k = norm(name); if (!k) return null;
    var zs = zonesSorted();
    for (var i = 0; i < zs.length; i++) if (lines(zs[i].items).some(function (n) { return norm(n) === k; })) return zs[i];
    return null;
  }
  function removeItemEverywhere(name) {
    var k = norm(name);
    zonesSorted().forEach(function (z) { z.items = lines(z.items).filter(function (n) { return norm(n) !== k; }).join('\n'); if (z.pins) delete z.pins[k]; });
  }
  function placeActive(zone, pt) {
    var name = activeName();
    if (!name) { placeMsg = 'Schreib zuerst einen Artikel in das Feld.'; renderPanel(); return; }
    var from = zoneOfItem(name);
    removeItemEverywhere(name);
    zone.items = lines(zone.items).concat([name]).join('\n');
    if (pt) { zone.pins = zone.pins || {}; zone.pins[norm(name)] = { n: name, x: Math.round(pt.x * 10) / 10, y: Math.round(pt.y * 10) / 10 }; }
    var q = queueList(); q.shift(); queue = q.join('\n'); saveQueue();
    placeMsg = '„' + name + '“ liegt jetzt in „' + (zone.name || 'Bereich') + '“.' + (from && from.id !== zone.id ? ' (vorher: „' + (from.name || 'Bereich') + '“)' : '');
    commit(); render(); renderPanel();
  }
  /* Eingaben sind nur Daten: alles wird auf bekannte Felder, Typen und Grenzen gebracht. */
  var KINDS = { rect: 1, line: 1, text: 1, callout: 1 };
  var LOOKS = { '': 1, shelf: 1, aisle: 1, fridge: 1, produce: 1, bakery: 1, promo: 1, counter: 1 };
  function cnum(v, d) { v = Number(v); return isFinite(v) ? Math.max(-10000, Math.min(10000, v)) : d; }
  function cstr(v, max) { return (typeof v === 'string' ? v : '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').slice(0, max); }
  function cleanItems(arr) {
    var out = [];
    if (!Array.isArray(arr)) return out;
    arr.slice(0, 2000).forEach(function (s) {
      if (!s || typeof s !== 'object' || !KINDS[s.kind]) return;
      var it = { id: uid(), kind: s.kind, type: 'shelf', name: cstr(s.name, 200), x: cnum(s.x, 0), y: cnum(s.y, 0), note: cstr(s.note, 2000) };
      if (s.kind === 'line') { it.type = 'wall'; it.x2 = cnum(s.x2, it.x); it.y2 = cnum(s.y2, it.y); }
      else {
        it.w = Math.max(1, cnum(s.w, 4)); it.h = Math.max(1, cnum(s.h, 2));
        if (s.kind === 'text') it.type = 'text';
        else if (s.kind === 'callout') { it.type = 'callout'; it.x2 = cnum(s.x2, it.x); it.y2 = cnum(s.y2, it.y); }
        else {
          it.type = Object.prototype.hasOwnProperty.call(TYPES, s.type) ? s.type : 'shelf';
          it.cats = cstr(s.cats, 20000); it.items = cstr(s.items, 50000);
          it.look = LOOKS[s.look] ? s.look : '';
          it.order = Math.max(0, Math.round(cnum(s.order, 0)));
          if (s.pins && typeof s.pins === 'object') {
            it.pins = {};
            Object.keys(s.pins).slice(0, 2000).forEach(function (k) {
              var q = s.pins[k];
              if (!q || typeof q !== 'object') return;
              var n = cstr(q.n, 200); if (!n) return;
              it.pins[norm(n)] = { n: n, x: cnum(q.x, 0), y: cnum(q.y, 0) };
            });
          }
        }
      }
      out.push(it);
    });
    return out;
  }
  function uniq(a) { var seen = {}; return a.filter(function (x) { var k = x.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true; }); }

  /* ---------- Speichern, Verlauf ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: state.items, view: view })); } catch (e) { /* ohne Speicher weiterarbeiten */ } }
  function commit() {
    var snap = JSON.stringify(state.items);
    if (hidx >= 0 && hist[hidx] === snap) return;
    hist = hist.slice(0, hidx + 1); hist.push(snap); if (hist.length > 120) hist.shift(); hidx = hist.length - 1;
    save(); updateUndo();
  }
  function restore(i) {
    hidx = i; state.items = JSON.parse(hist[hidx]);
    if (sel && !get(sel)) sel = null;
    save(); render(); renderPanel(); updateUndo();
  }
  function updateUndo() { $('undo').disabled = hidx <= 0; $('redo').disabled = hidx >= hist.length - 1; }

  /* ---------- Koordinaten ---------- */
  function toUnits(e) {
    var r = svg.getBoundingClientRect();
    return { x: ((e.clientX - r.left - view.x) / view.k) / U, y: ((e.clientY - r.top - view.y) / view.k) / U };
  }
  function snap(v) { return Math.round(v); }

  /* ---------- Zeichnen ---------- */
  function rank(it) { return it.kind === 'rect' ? (it.type === 'zone' ? 0 : 1) : it.kind === 'line' ? 2 : it.kind === 'text' ? 3 : 4; }

  function boxSVG(it, isSel, isDraft) {

  function exportApp() {

    var b = $('newplan');
    if (!confirmNew && state.items.length) {
      confirmNew = true; b.textContent = 'Wirklich leeren?'; b.classList.add('danger');
      setTimeout(function () { confirmNew = false; b.textContent = 'Leeres Blatt'; b.classList.remove('danger'); }, 3500);
      return;
    }
    confirmNew = false; b.textContent = 'Leeres Blatt'; b.classList.remove('danger');
    state.items = []; sel = null; view = { x: 30, y: 30, k: 1 }; $('banner').hidden = true;
    commit(); render(); renderPanel();
  });

  document.addEventListener('keydown', function (e) {
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    var mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) { if (hidx < hist.length - 1) restore(hidx + 1); } else if (hidx > 0) restore(hidx - 1); return; }
    if (mod && k === 'y') { e.preventDefault(); if (hidx < hist.length - 1) restore(hidx + 1); return; }
    if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
    if (mod) return;
    if (k === 'delete' || k === 'backspace') { if (sel) { e.preventDefault(); removeSel(); } return; }
    if (k === 'escape') { setTool('select'); sel = null; draft = null; render(); renderPanel(); return; }
    if (k === 'v') setTool('select'); else if (k === 'l') setTool('line'); else if (k === 't') setTool('text'); else if (k === 'n') setTool('callout'); else if (k === 'p') setTool('place');
    else if (k === 'r') setTool('rect', rectType);
    var it = sel && get(sel), step = 0;
    if (it && k.indexOf('arrow') === 0) {
      e.preventDefault();
      var dx = k === 'arrowleft' ? -1 : k === 'arrowright' ? 1 : 0, dy = k === 'arrowup' ? -1 : k === 'arrowdown' ? 1 : 0;
      it.x += dx; it.y += dy; if (it.x2 != null && it.kind !== 'callout') { it.x2 += dx; it.y2 += dy; }
      commit(); render(); syncFields();
    }
  });

  /* ---------- Start ---------- */
  buildPalette(); setTool('select');
  var loaded = false;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.items)) { var ci = cleanItems(d.items); if (ci.length) { state.items = ci; if (d.view && typeof d.view === 'object') view = { x: cnum(d.view.x, 30), y: cnum(d.view.y, 30), k: Math.max(0.1, Math.min(8, cnum(d.view.k, 1))) }; loaded = true; } } }
  } catch (e) { /* ohne gespeicherten Stand starten */ }
  if (!loaded) {
    state.items = sample();
    $('bannerText').textContent = 'Beispielplan zum Ausprobieren. „Leeres Blatt“ oben rechts räumt auf.';
    $('banner').hidden = false;
  }
  renumber(); commit(); render(); renderPanel();
  if (!loaded) requestAnimationFrame(fit);
  window.addEventListener('resize', renderHandles);

  window.addEventListener('hashchange', function () { if (/^#plan=/.test(location.hash)) location.reload(); });
  /* ---------- Plan aus der App (Link mit #plan=...) ---------- */
  (function fromHash() {
    var m = /^#plan=([A-Za-z0-9_-]+)$/.exec(location.hash || '');
    if (!m || typeof DecompressionStream === 'undefined') return;
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    if (m[1].length > 400000) { setStatus('Der Plan aus der App ist zu groß.', true); return; }
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var rd = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader(), parts = [], total = 0;
    (function pump() {
      return rd.read().then(function (r) {
        if (r.done) return;
        total += r.value.length;
        if (total > 3000000) { rd.cancel(); throw new Error('zu groß'); }
        parts.push(r.value); return pump();
      });
    })().then(function () { return new Blob(parts).text(); }).then(function (txt) {
      try { localStorage.setItem(KEY + '-backup', localStorage.getItem(KEY) || ''); } catch (e) { /* egal */ }
      loadText(txt);
      $('banner').hidden = false;
      $('bannerText').textContent = 'Plan aus der App geladen. Wenn du fertig bist: „Für die App kopieren“ und in der App importieren.';
      history.replaceState(null, '', location.pathname);
    }).catch(function () { setStatus('Der Plan aus der App konnte nicht gelesen werden.', true); });
  })();
})();
</script>
